<main class="home">
  <h1>Internal Full Stack</h1>

  @if (loading()) {
    <p>Loading greeting from the API...</p>
  } @else if (error()) {
    <p class="error">Could not reach the API.</p>
  } @else if (greeting(); as g) {
    <p>{{ g.message }}</p>
    <p class="timestamp">Server time (UTC): {{ g.serverTimeUtc }}</p>
  }
</main>
